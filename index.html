            });

            html += `

            `;
            
            mainContent.innerHTML = html;
        }

        function startQuiz(genreIndex) {
            state.currentGenreIndex = genreIndex;
            state.genreData = quizData[genreIndex];
            state.questionQueue = state.genreData.questions.map((_, i) => i);
            state.currentQueueIndex = 0;
            state.incorrectIndices = [];
            state.score = 0;
            state.isRetryMode = false;
            renderQuestion();
        }

        function startRetry() {
            state.questionQueue = [...state.incorrectIndices];
            state.currentQueueIndex = 0;
            state.incorrectIndices = [];
            state.score = 0;
            state.isRetryMode = true;
            renderQuestion();
        }

        function renderQuestion() {
            const actualIndex = state.questionQueue[state.currentQueueIndex];
            const questionData = state.genreData.questions[actualIndex];
            const totalQ = state.questionQueue.length;
            const currentQNum = state.currentQueueIndex + 1;
            
            const modeBadge = state.isRetryMode 
                ? `<span class="text-xs tracking-wider text-gold-400 border border-gold-500/40 px-2.5 py-0.5 rounded mr-3">復習</span>` 
                : '';

            let html = `
                <div class="bg-deep-800/80 border border-aqua-500/15 rounded-xl overflow-hidden fade-in">
                    <div class="px-6 py-4 border-b border-deep-600/60 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                        <div class="flex items-center text-sm text-gray-400">
                            ${modeBadge}
                            <span class="tracking-wide">${state.genreData.title}</span>
                        </div>
                        <span class="text-xs tracking-widest text-gold-400/80">
                            ${currentQNum} / ${totalQ}
                        </span>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <p class="text-base md:text-lg leading-relaxed text-gray-100 mb-10">
                            ${questionData.question}
                        </p>

                        <div class="space-y-3" id="options-container">
            `;

            questionData.options.forEach((option, index) => {
                html += `
                    <button onclick="handleAnswer(${index}, this)" class="option-btn w-full text-left px-5 py-4 rounded-lg border border-deep-600 bg-deep-700/30 hover:border-gold-400/70 hover:bg-deep-600/40 text-gray-200 transition-all duration-200 flex items-center gap-4 group">

                        <span class="text-sm md:text-base group-hover:text-gold-100 transition-colors">${option}</span>
                    </button>
                `;
            });

            html += `
                        </div>
                        
                        <div id="feedback-area" class="mt-10 hidden opacity-0 transition-opacity duration-400">
                        </div>
                    </div>
                </div>
            `;

            mainContent.innerHTML = html;
        }

        function handleAnswer(selectedIndex, buttonElement) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            buttonElement.classList.add('btn-clicked');
            setTimeout(() => buttonElement.classList.remove('btn-clicked'), 120);

            const actualIndex = state.questionQueue[state.currentQueueIndex];
            const questionData = state.genreData.questions[actualIndex];
            const isCorrect = (selectedIndex === questionData.answer);
            
            if (isCorrect) {
                state.score++;
            } else {
                state.incorrectIndices.push(actualIndex);
            }

            buttons.forEach((btn, index) => {
                btn.classList.remove('hover:border-gold-400/70', 'hover:bg-deep-600/40');
                if (index === questionData.answer) {
                    btn.classList.add('border-emerald-500/60', 'bg-emerald-900/20', 'text-emerald-200');
                    btn.querySelector('span:first-child').classList.add('border-emerald-500/50', 'text-emerald-400');
                } else if (index === selectedIndex && !isCorrect) {
                    btn.classList.add('border-red-500/50', 'bg-red-900/15', 'text-red-200');
                    btn.querySelector('span:first-child').classList.add('border-red-500/40', 'text-red-400');
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            const feedbackArea = document.getElementById('feedback-area');
            const resultLabel = isCorrect 
                ? `<div class="text-gold-400 text-sm font-medium tracking-wide mb-4">正解</div>` 
                : `<div class="text-red-400/90 text-sm font-medium tracking-wide mb-4">不正解</div>`;
            
            const isLastQuestion = state.currentQueueIndex === state.questionQueue.length - 1;
            const nextBtnText = isLastQuestion ? '結果を見る' : '次の問題へ';

            feedbackArea.innerHTML = `
                <div class="border-t border-deep-600/50 pt-8">
                    ${resultLabel}
                    <div class="border-l-4 border-gold-500/70 pl-5">
                        <h4 class="text-sm font-medium text-gray-400 mb-3 tracking-wide">解説</h4>
                        <p class="text-sm md:text-base leading-relaxed text-gray-300 mb-8">
                            ${questionData.explanation}
                        </p>
                    </div>
                    <div class="flex justify-end">
                        <button onclick="nextStep()" class="px-6 py-3 bg-aqua-500/10 border border-aqua-400/40 hover:bg-aqua-500/20 hover:border-gold-400/50 text-aqua-300 hover:text-gold-300 text-sm font-medium rounded-lg transition-all duration-200">
                            ${nextBtnText}
                        </button>
                    </div>
                </div>
            `;
            
            feedbackArea.classList.remove('hidden');
            setTimeout(() => {
                feedbackArea.classList.remove('opacity-0');
            }, 40);
        }

            if (state.currentQueueIndex < state.questionQueue.length - 1) {
                state.currentQueueIndex++;
                renderQuestion();

                        <div class="text-4xl font-light text-gray-100 tracking-tight">
                            ${score}<span class="text-xl text-gray-500 ml-1">/ ${totalQ}</span>
                        </div>
                        <p class="mt-6 text-sm text-gray-400 leading-relaxed max-w-md mx-auto">${message}</p>
                    </div>

                    <div class="mt-10 flex flex-col sm:flex-row flex-wrap gap-3 justify-center">
                        ${buttonsHtml}
                    </div>
                </div>
            `;
            
            mainContent.innerHTML = html;
        }

        window.onload = init;
    </script>
</body>
</html>
